spring:
  datasource:
    url: jdbc:h2:mem:smartqueue;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=60000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
smartqueue:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    expiration-minutes: 60
  redis:
    enabled: false
  mail:
    enabled: false
  rate-limit:
    enabled: false
  scheduling:
    enabled: false
management:
  health:
    redis:
      enabled: false
